idth: 1.0;" x1="344" x2="751" y1="331.7891" y2="331.7891"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="124" x="351" y="326.7231">validate(createDto)</text><polygon fill="#A80036" points="926,356.9219,936,360.9219,926,364.9219,930,360.9219" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="344" x2="932" y1="360.9219" y2="360.9219"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="206" x="351" y="355.856">create(createDto, transactionId)</text><polygon fill="#A80036" points="22,386.0547,12,390.0547,22,394.0547,18,390.0547" style="stroke: #A80036; stroke-width: 1.0;"/><ellipse cx="343.5" cy="389.3047" fill="none" rx="4" ry="4" style="stroke: #A80036; stroke-width: 1.5;"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="16" x2="339" y1="390.0547" y2="390.0547"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="234" x="28" y="384.9888">ShowtimeCreationStatus.Succeeded</text><!--MD5=[97b7f1d890f509955c5581b0327029b4]
@startuml
participant "ShowtimeCreation\nService" as creation
participant "ShowtimeCreationWorker\nService" as worker
Queue Queue as queue
participant "ShowtimeBulkValidator\nService" as validator
participant "ShowtimeBulkCreator\nService" as creator

creation -> worker: requestShowtimeCreation(createDto)
worker -> worker: createTransactionId
worker -> queue: enqueueJob { createDto, transactionId }
[o<- worker  : ShowtimeCreationStatus.Waiting
creation <- - worker: transactionId
[o-> worker:processNextJob()
worker -> queue: dequeueJob { createDto, transactionId }
[o<- worker  : ShowtimeCreationStatus.Processing
worker -> validator: validate(createDto)
worker -> creator: create(createDto, transactionId)
[o<- worker  : ShowtimeCreationStatus.Succeeded

@enduml

