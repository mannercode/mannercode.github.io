@startuml
class Movie {
    id: ObjectId
}

class Theater {
    id: ObjectId
}

class Showtime {
    id: ObjectId
    theaterId: ObjectId
    movieId: ObjectId
}

class Ticket {
    id: ObjectId
    showtimeId: ObjectId
    theaterId: ObjectId
    movieId: ObjectId
}

Ticket - -> Showtime
Ticket - -> Movie
Ticket - -> Theater
Showtime - -> Movie
Showtime - -> Theater
@enduml

