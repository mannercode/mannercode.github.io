ont-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="124" x="111.5" y="80.6606">validate(createDto)</text><polygon fill="#A80036" points="514.5,110.8594,524.5,114.8594,514.5,118.8594,518.5,114.8594" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="298.5" x2="520.5" y1="114.8594" y2="114.8594"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="204" x="305.5" y="109.7935">moviesExist(createDto.movieId)</text><polygon fill="#A80036" points="598.5,139.9922,608.5,143.9922,598.5,147.9922,602.5,143.9922" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="298.5" x2="604.5" y1="143.9922" y2="143.9922"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="227" x="305.5" y="138.9263">theatersExist(createDto.theaterIds)</text><polygon fill="#A80036" points="695.5,169.125,705.5,173.125,695.5,177.125,699.5,173.125" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="298.5" x2="701.5" y1="173.125" y2="173.125"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="234" x="305.5" y="168.0591">getShowtimes(createDto.theaterIds)</text><line style="stroke: #A80036; stroke-width: 1.0;" x1="298.5" x2="340.5" y1="215.8906" y2="215.8906"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="340.5" x2="340.5" y1="215.8906" y2="228.8906"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="299.5" x2="340.5" y1="228.8906" y2="228.8906"/><polygon fill="#A80036" points="309.5,224.8906,299.5,228.8906,309.5,232.8906,305.5,228.8906" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="169" x="305.5" y="210.8247">findConflictingShowtimes()</text><path d="M486,186.125 L486,241.125 L831,241.125 L831,196.125 L821,186.125 L486,186.125 " fill="#FBFB77" filter="url(#f1upca14bx705p)" style="stroke: #A80036; stroke-width: 1.0;"/><path d="M821,186.125 L821,196.125 L831,196.125 L821,186.125 " fill="#FBFB77" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="307" x="492" y="203.1919">1. 생성하려는 상영시간을 10분 단위의 timeslots(Set)으로 등록한다.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="324" x="492" y="218.3247">2. 기존에 존재하는 showtimes의 `startTime`과 `endTime`이</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="151" x="504" y="233.4575">timeslots에 존재하는지 확인한다.</text><polygon fill="#A80036" points="115.5,267.6563,105.5,271.6563,115.5,275.6563,111.5,271.6563" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="109.5" x2="297.5" y1="271.6563" y2="271.6563"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="134" x="121.5" y="266.5903">conflictingShowtimes</text><!--MD5=[f2f366e629300cc1bde220e53a3e8984]
@startuml
participant "ShowtimeCreationWorker\nService" as worker
participant "ShowtimeBulkValidator\nService" as validator
participant "Movies\nService" as movies
participant "Theaters\nService" as theaters
participant "Showtimes\nService" as showtimes

worker -> validator: validate(createDto)
validator -> movies: moviesExist(createDto.movieId)
validator -> theaters: theatersExist(createDto.theaterIds)
validator -> showtimes: getShowtimes(createDto.theaterIds)
validator -> validator: findConflictingShowtimes()
note right
1. 생성하려는 상영시간을 10분 단위의 timeslots(Set)으로 등록한다.
2. 기존에 존재하는 showtimes의 `startTime`과 `endTime`이
   timeslots에 존재하는지 확인한다.
end note
worker <- - validator: conflictingShowtimes
@enduml

