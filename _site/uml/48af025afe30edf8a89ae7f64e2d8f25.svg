@startuml
class Movie {
    id: ObjectId
    title: string
    genres: MovieGenre[] {Action, Horror, ... }
    releaseDate: Date
    plot: string
    durationInSeconds: number
    director: string
    rating: MovieRating { PG13, R, NC17 }
    imageIds: ObjectId[]
}

class Theater {
    id: ObjectId
    name: string
    latLong: latLong
    seatmap: Seatmap
}
note left of Theater::seatmap
Seatmap {
    blocks:[{
        name: 'A',
        rows:[{
            name: '1',
            seats: 'OOOOXXOOOO'
            }]
        }]
}
end note

class Showtime {
    id: ObjectId
    movieId: ObjectId
    theaterId: ObjectId
    startTime: Date
    endTime: Date
}

class Ticket {
    id: ObjectId
    showtimeId: ObjectId
    movieId: ObjectId
    theaterId: ObjectId
    status: TicketStatus { Available, Sold}
    seat: Seat { block: string, row: string, seatNumber: number }
}

Ticket "*" - -> "1" Showtime
Ticket "*" - -> "1" Movie
Ticket "*" - -> "1" Theater
Showtime "*" - -> "1" Movie
Showtime "*" - -> "1" Theater
@enduml

